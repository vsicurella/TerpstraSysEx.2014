name: Build Lumatone Editor

on: [push, pull_request]

env:
  JUCE_VERSION: 7.0.5
  ARTIFACTS: LumatoneEditor_artefacts

jobs:
  build-lte-linux:
    name: Build Lumatone Editor (Linux)

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE to $HOME
        run: |
          export juce_DIR=juce-${{ env.JUCE_VERSION }}-linux
          wget https://github.com/juce-framework/JUCE/releases/download/${{ env.JUCE_VERSION }}/$juce_DIR.zip
          unzip $juce_DIR.zip -d ~/
          ls ~
      - name: Install APT dependencies
        run: |
          sudo apt update
          sudo apt install libssh2-1-dev libasound2-dev libjack-jackd2-dev \
              ladspa-sdk \
              libcurl4-openssl-dev  \
              libfreetype-dev libfontconfig1-dev \
              libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
              libwebkit2gtk-4.1-dev \
              libglu1-mesa-dev mesa-common-dev
      - name: Build Lumatone Editor
        run: |
          export juce_DIR=~/JUCE
          cp CMakeLists.txt.template CMakeLists.txt
          cmake -S . -B build
          # ~/JUCE/Projucer --resave TerpstraSysEx.jucer
          # cd Builds/Linux
          # cd build
          # make CONFIG=Release
          cmake --build build --config Release
      - name: List build directory
        run: |
          # cd Builds/Linux
          find build/$ARTIFACTS/Lumatone\ Editor
          # find
      - name: Upload Lumatone Editor
        uses: actions/upload-artifact@v4
        with:
          name: LumatoneEditor-Linux
          path: build/$ARTIFACTS/Lumatone\ Editor
          if-no-files-found: error

  build-lte-macos:
    name: Build Lumatone Editor (macOS)

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE to $HOME
        run: |
          export juce_DIR=juce-${{ env.JUCE_VERSION }}-osx
          wget https://github.com/juce-framework/JUCE/releases/download/${{ env.JUCE_VERSION }}/$juce_DIR.zip
          unzip $juce_DIR.zip
          ls
      - name: Build Lumatone Editor
        run: |
          export juce_DIR=JUCE
          cp CMakeLists.txt.template CMakeLists.txt
          cmake -S . -B build
          # ~/JUCE/Projucer.app/Contents/MacOS/Projucer --resave TerpstraSysEx.jucer
          # cd Builds/MacOSX
          # cd build
          # xcodebuild -configuration Release
          cmake --build build --config Release
      - name: List build directory
        run: |
          # cd Builds/MacOSX
          # cd build/$ARTIFACTS
          find build/$ARTIFACTS/Lumatone\ Editor.app
      - name: Upload Lumatone Editor
        uses: actions/upload-artifact@v4
        with:
          name: LumatoneEditor-macOS
          # path: Builds/MacOSX/build/Release
          path: build/$ARTIFACTS/Lumatone\ Editor
          if-no-files-found: error

  build-lte-windows:
    name: Build Lumatone Editor (Windows)

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Install JUCE to C:\
        run: |
          Invoke-WebRequest https://github.com/juce-framework/JUCE/releases/download/${{env.JUCE_VERSION}}/juce-${{env.JUCE_VERSION}}-windows.zip -OutFile JUCE.zip
          dir
          7z x JUCE.zip -oC:\
          C:
          dir C:\JUCE
      - name: Build Lumatone Editor
        run: |
          set juce_DIR=C:\JUCE
          echo juceDir:%juce_DIR%
          copy CMakeLists.txt.template CmakeLists.txt
          cmake -S . -B build
          # bash -c '/c/JUCE/Projucer --resave TerpstraSysEx.jucer'
          # cd Builds/VisualStudio2022
          msbuild "build\LUMATONE_EDITOR.sln" /p:configuration=Release
      - name: List build directory
        run: |
          # cd Builds/VisualStudio2019
          cd build\$env:ARTIFACTS\Release\
          Get-ChildItem -Recurse
      - name: Upload Lumatone Editor
        uses: actions/upload-artifact@v4
        with:
          name: LumatoneEditor-Windows
          # path: "Builds/VisualStudio2019/x64/Release/App/Lumatone Editor.exe"
          path: "build/$ARTIFACTS/Release/Lumatone Editor.exe"
          if-no-files-found: error
      - name: Upload dynamic libraries
        uses: actions/upload-artifact@v4
        with:
          name: LumatoneEditor-Windows
          path: Libraries/win64/bin/*.dll
          if-no-files-found: error
