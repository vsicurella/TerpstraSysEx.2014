name: Build Lumatone Editor

on: [push, pull_request]

env:
  JUCE_VERSION: 7.0.5
  ARTIFACTS: $ARTIFACTS

jobs:
  build-lte-linux:
    name: Build Lumatone Editor (Linux)

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE to $HOME
        run: |
          export juce_DIR=juce-$JUCE_VERSION-linux
          wget https://github.com/juce-framework/JUCE/releases/download/$JUCE_VERSION/$juce_DIR.zip
          unzip -d ~ $juce_DIR.zip
      - name: Install APT dependencies
        run: |
          sudo apt update
          sudo apt install libssh2-1-dev libasound2-dev libjack-jackd2-dev \
              ladspa-sdk \
              libcurl4-openssl-dev  \
              libfreetype-dev libfontconfig1-dev \
              libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
              libwebkit2gtk-4.1-dev \
              libglu1-mesa-dev mesa-common-dev
      - name: Build Lumatone Editor
        run: |
          cmake -S . -B build
          # ~/JUCE/Projucer --resave TerpstraSysEx.jucer
          # cd Builds/Linux
          cd build
          make CONFIG=Release
      - name: List build directory
        run: |
          # cd Builds/Linux
          cd build/$ARTIFACTS/Release
          find
      - name: Upload Lumatone Editor
        uses: actions/upload-artifact@v4
        with:
          name: LumatoneEditor-Linux
          path: build/$ARTIFACTS/Release/Lumatone\ Editor
          if-no-files-found: error

  build-lte-macos:
    name: Build Lumatone Editor (macOS)

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE to $HOME
        run: |
          export juce_DIR=juce-$JUCE_VERSION-osx
          wget https://github.com/juce-framework/JUCE/releases/download/$JUCE_VERSION/$juce_DIR.zip
          unzip -d ~ $juce_DIR.zip
      - name: Build Lumatone Editor
        run: |
          cmake -S . -B build
          # ~/JUCE/Projucer.app/Contents/MacOS/Projucer --resave TerpstraSysEx.jucer
          # cd Builds/MacOSX
          cd build
          xcodebuild -configuration Release
      - name: List build directory
        run: |
          # cd Builds/MacOSX
          cd build/$ARTIFACTS/Release/
          find .
      - name: Upload Lumatone Editor
        uses: actions/upload-artifact@v4
        with:
          name: LumatoneEditor-macOS
          # path: Builds/MacOSX/build/Release
          path: build/$ARTIFACTS/Release
          if-no-files-found: error

  build-lte-windows:
    name: Build Lumatone Editor (Windows)

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Install JUCE to C:\
        run: |
          set juce_DIR=juce-#JUCE_VERSION-windows
          Invoke-WebRequest https://github.com/juce-framework/JUCE/releases/download/$JUCE_VERSION/%juce_DIR%.zip -OutFile %juce_DIR%.zip
          7z x %juce_DIR.zip% -o .
      - name: Build Lumatone Editor
        run: |
          cmake -S . -B build
          # bash -c '/c/JUCE/Projucer --resave TerpstraSysEx.jucer'
          # cd Builds/VisualStudio2022
          msbuild "build\LUMATONE_EDITOR.sln" /p:configuration=Release
      - name: List build directory
        run: |
          # cd Builds/VisualStudio2019
          cd build\%ARTIFACTS%\Release\
          Get-ChildItem -Recurse
      - name: Upload Lumatone Editor
        uses: actions/upload-artifact@v4
        with:
          name: LumatoneEditor-Windows
          # path: "Builds/VisualStudio2019/x64/Release/App/Lumatone Editor.exe"
          path: "build\\%ARTIFACTS%\\Release\\Lumatone Editor.exe"
          if-no-files-found: error
      - name: Upload dynamic libraries
        uses: actions/upload-artifact@v4
        with:
          name: LumatoneEditor-Windows
          path: Libraries/win64/bin/*.dll
          if-no-files-found: error
